services:
  # Render deployment configuration for SalesCareerHub
  - type: web
    name: salescareerhub
    env: node
    plan: free
    # Build: install deps, generate Prisma client, build Next.js (standalone output)
    buildCommand: >-
      corepack enable pnpm &&
      pnpm install --frozen-lockfile=false &&
      cd apps/web && npx prisma generate &&
      cd ../.. &&
      NODE_OPTIONS="--max-old-space-size=384" pnpm run build:web
    # Start: use standard Next.js start command
    startCommand: >-
      cd apps/web && NODE_OPTIONS="--max-old-space-size=384" npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
